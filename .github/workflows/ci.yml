name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Engine logic is platform-free — prove it builds and passes on Linux, which
  # also guards against macOS-specific code leaking into the engine crate.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p glowkey-engine -- --check
      - run: cargo clippy -p glowkey-engine --all-targets -- -D warnings
      - run: cargo test -p glowkey-engine
      # The app crate claims to build as a stub off macOS, and nothing was
      # checking it: this job only ever named `-p glowkey-engine`, so a module
      # declared without its `#[cfg(target_os = "macos")]` compiled fine on the
      # macOS job and broke every other platform silently. That is exactly the
      # breakage the Windows port would inherit, so prove the stub here.
      - run: cargo check -p glowkey

  # Full workspace, including the objc2 CGEventTap shell, builds on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Privacy guard: the input method sees every keystroke, so it must not add a
      # direct networking dependency. (CloudKit/CoreData are pulled in transitively
      # by AppKit in every AppKit app and are not called; this checks that GlowKey
      # itself links nothing that opens the network.)
      - name: Assert no direct networking framework linked
        run: |
          cargo build -p glowkey
          BIN=target/debug/GlowKey
          # Without this the guard passes vacuously: GitHub's default shell is
          # `bash -e` with no pipefail, so a failing `otool` produces no grep
          # match and the step happily prints OK over a binary that is not there.
          test -x "$BIN" || { echo "ERROR: no binary at $BIN to check." >&2; exit 1; }
          if otool -L "$BIN" | grep -Ei '/Network\.framework|CFNetwork|/libcurl'; then
            echo "ERROR: GlowKey links a networking framework — a keystroke-observing IME must not." >&2
            exit 1
          fi
          echo "OK: no direct networking framework linked."
