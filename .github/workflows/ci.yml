name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Engine, session policy and input policy are platform-free: prove they build
  # and pass on Linux, which also guards against OS-specific code leaking in.
  #
  # `glowkey-input` holds the decision ladder every platform runs. Nothing but
  # this job stops an OS crate, a `cfg(target_os)` or an `unsafe` block drifting
  # into it: on the macOS job that code would compile perfectly.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p glowkey-engine -p glowkey-session -p glowkey-input -- --check
      - run: cargo clippy -p glowkey-engine -p glowkey-session -p glowkey-input --all-targets -- -D warnings
      - run: cargo test -p glowkey-engine -p glowkey-session -p glowkey-input
      # The optional `serde` features compile too, both ways.
      - run: cargo check -p glowkey-engine -p glowkey-session -p glowkey-input --features serde
      # The app crate claims to build as a stub off macOS, and nothing was
      # checking it: this job only ever named `-p glowkey-engine`, so a module
      # declared without its `#[cfg(target_os = "macos")]` compiled fine on the
      # macOS job and broke every other platform silently. That is exactly the
      # breakage the Windows port would inherit, so prove the stub here.
      - run: cargo check -p glowkey

  # The Windows shell: a WH_KEYBOARD_LL hook and SendInput, linked and its tests
  # run. This job is worth more than it looks — it is the first place Windows
  # code is *linked* rather than type-checked, which no amount of `cargo check`
  # on a Mac achieves.
  #
  # It also closes the gap that let six engine tests assert macOS bundle
  # identifiers against a per-target exclusion table and go unnoticed until
  # somebody ran the suite on Windows by hand. Nothing but this job stops that
  # recurring.
  #
  # What it does NOT prove: that GlowKey types Vietnamese. CI cannot type into an
  # application, so a green badge here means the tests run — never that the input
  # method works. That remains a human at a real machine (Phase 6 of the port).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Privacy guard, the Windows half of the macOS one below. GlowKey observes
      # every keystroke on the machine, so it must not link anything that can
      # open a socket.
      #
      # This checks the **built binary**, not a manifest. An earlier version
      # grepped `app/Cargo.toml` for networking feature groups, which was honest
      # while `windows-sys` was the only Windows dependency and stopped being so
      # the moment the settings window brought in eframe/winit/wgpu — none of
      # whose transitive features a grep of our own manifest can see. A guard that
      # cannot see what it claims to check is worse than no guard, because it
      # reads as reassurance.
      - name: Assert no networking library is linked
        shell: pwsh
        run: |
          cargo build --release -p glowkey
          $bin = "target/release/GlowKey.exe"
          if (-not (Test-Path $bin)) { throw "no binary at $bin to check" }
          # The import table, read without needing the Visual Studio tools: DLL
          # names appear as ASCII in the file, so a linked import is findable and
          # an absent one cannot be faked by this test passing vacuously.
          $bytes = [System.IO.File]::ReadAllBytes($bin)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $banned = @('ws2_32.dll', 'wininet.dll', 'winhttp.dll', 'urlmon.dll', 'wsock32.dll')
          $found = $banned | Where-Object { $text -match [regex]::Escape($_) }
          if ($found) {
            Write-Error "GlowKey links a networking library ($($found -join ', ')) - a keystroke-observing IME must not."
            exit 1
          }
          # Prove the check can fail: a DLL that IS linked must be found by the
          # same method, or the search is looking at the wrong thing.
          if ($text -notmatch [regex]::Escape('USER32.dll')) {
            Write-Error "The import scan found no USER32.dll, so it is not reading imports - the guard above proves nothing."
            exit 1
          }
          Write-Output "OK: no networking library linked."

  # Full workspace, including the objc2 CGEventTap shell, builds on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Privacy guard: the input method sees every keystroke, so it must not add a
      # direct networking dependency. (CloudKit/CoreData are pulled in transitively
      # by AppKit in every AppKit app and are not called; this checks that GlowKey
      # itself links nothing that opens the network.)
      - name: Assert no direct networking framework linked
        run: |
          cargo build -p glowkey
          BIN=target/debug/GlowKey
          # Without this the guard passes vacuously: GitHub's default shell is
          # `bash -e` with no pipefail, so a failing `otool` produces no grep
          # match and the step happily prints OK over a binary that is not there.
          test -x "$BIN" || { echo "ERROR: no binary at $BIN to check." >&2; exit 1; }
          if otool -L "$BIN" | grep -Ei '/Network\.framework|CFNetwork|/libcurl'; then
            echo "ERROR: GlowKey links a networking framework — a keystroke-observing IME must not." >&2
            exit 1
          fi
          echo "OK: no direct networking framework linked."
