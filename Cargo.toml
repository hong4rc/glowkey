# GlowKey: a Vietnamese input method for macOS and Windows.
# Workspace root. The three library crates (engine, session, input) are
# platform-free and unit-testable on any OS; the app crate is the shell.
[workspace]
members = [
    "crates/glowkey-engine",
    "crates/glowkey-session",
    "crates/glowkey-input",
    "app",
]
resolver = "2"

# Release profile tuned like the sibling `marau` project: small, fast, stripped.
# An input method sits on the keystroke hot path, so favour a lean binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
