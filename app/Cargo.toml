[package]
name = "glowkey"
version = "0.1.0"
description = "GlowKey — Vietnamese Telex input method for macOS (InputMethodKit shell)"
edition = "2021"
license = "MIT"

# The macOS input method is a normal executable that runs an IMKServer instead of
# a windowed app. It links only on macOS; on other platforms it builds an empty
# stub so `cargo test` on the engine still works in CI on Linux.
[[bin]]
name = "GlowKey"
path = "src/main.rs"

[dependencies]
glowkey-engine = { path = "../crates/glowkey-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
# All-Rust macOS-native shell via objc2, matching the sibling `marau` project's
# pattern of calling Apple frameworks directly from Rust rather than through Swift.
#
# GlowKey wraps the active keyboard layout with a CGEventTap (like EVKey/OpenKey):
# it intercepts key events after the system layout maps them, adds Vietnamese, and
# re-emits the result. This keeps the user's Colemak/US layout live and requires an
# Accessibility permission (it does not work in secure/password fields).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSObject", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton", "NSTextField", "NSSegmentedControl", "NSStackView", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSCell", "NSText"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGError"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort", "CFBase", "CFDictionary", "CFNumber"] }
