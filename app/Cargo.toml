[package]
name = "glowkey"
version = "0.1.0"
description = "GlowKey — Vietnamese Telex input method for macOS (InputMethodKit shell)"
edition = "2021"
license = "MIT"

# The input method is a normal executable that installs a CGEventTap and runs as a
# background agent, rather than a windowed app. It links only on macOS; on other
# platforms every module is cfg'd out and `main` is a one-line stub, so the
# workspace still resolves and the engine's tests run in CI on Linux.
#
# The capital G is load-bearing, which is why this section exists at all: the
# package is `glowkey`, so without it cargo would emit `target/…/glowkey`.
# `scripts/build-app.sh` copies `target/…/GlowKey`, and macOS requires the bundle
# to contain `Contents/MacOS/<CFBundleExecutable>` spelled exactly.
[[bin]]
name = "GlowKey"
path = "src/main.rs"

[dependencies]
# The typing policy and, through it, the engine. The app names one crate for
# both; the shipped exclusion tables it hands the session live in
# src/default_exclusions/.
glowkey-session = { path = "../crates/glowkey-session", features = ["serde"] }
# The decision ladder, with no operating system in it. Every platform backend
# under src/platform/ runs this same policy rather than its own reading of it.
glowkey-input = { path = "../crates/glowkey-input", features = ["serde"] }
# The preferences file model lives here now (prefs_model.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# All-Rust macOS-native shell via objc2, matching the sibling `marau` project's
# pattern of calling Apple frameworks directly from Rust rather than through Swift.
#
# GlowKey wraps the active keyboard layout with a CGEventTap (like EVKey/OpenKey):
# it intercepts key events after the system layout maps them, adds Vietnamese, and
# re-emits the result. This keeps the user's Colemak/US layout live and requires an
# Accessibility permission (it does not work in secure/password fields).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSObject", "NSDictionary", "NSGeometry", "NSURL", "NSBundle", "NSLocale", "NSFileManager"] }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSWorkspace", "NSPasteboard", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton", "NSTextField", "NSSegmentedControl", "NSStackView", "NSTabView", "NSTabViewItem", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSCell", "NSText", "NSFont", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSColor", "NSLayoutAnchor", "NSScrollView", "NSClipView", "NSImage", "NSImageView"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGError"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort", "CFBase", "CFDictionary", "CFNumber", "CFDate"] }
objc2-service-management = "0.3"

# The Windows backend: a WH_KEYBOARD_LL hook plus SendInput, which is the same
# intercept/suppress/inject shape the CGEventTap gives on macOS. See
# `docs/decisions/0009-windows-low-level-hook.md` for why not TSF.
#
# One crate, and the feature list is explicit and minimal on purpose. This
# process observes every keystroke on the machine, so "what does it link" is part
# of the privacy claim in PRIVACY.md, not a build detail — the macOS side keeps
# its objc2 feature lists narrow for the same reason.
[target.'cfg(target_os = "windows")'.dependencies]
# For `EventLoopBuilderExtWindows::with_any_thread`, so the one eframe event
# loop can live on its own thread (docs/decisions/0011). Already in the tree
# through eframe; named here only for the trait.
winit = { version = "0.30", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # The hook itself, its message loop, and the foreground-window query.
    "Win32_UI_WindowsAndMessaging",
    # SendInput, ToUnicodeEx, the virtual-key constants.
    "Win32_UI_Input_KeyboardAndMouse",
    # SetWinEventHook: the foreground-change notification. Not optional — a
    # per-keystroke foreground query is what froze a Mac (decisions/0008).
    "Win32_UI_Accessibility",
    # Resolving the foreground window to an executable name, and reading our own
    # integrity level to detect the UIPI case.
    "Win32_System_Threading",
    "Win32_Security",
    # SHGetKnownFolderPath: %APPDATA% and %LOCALAPPDATA% asked of the system
    # rather than interpolated, which is what makes it right on a redirected
    # profile.
    "Win32_UI_Shell",
    "Win32_System_Com",
    # The tray icon's window class and menu, and the GDI needed to draw the
    # four indicator glyphs rather than ship four .ico files.
    "Win32_Graphics_Gdi",
    # Launch-at-login: one HKCU\...\Run value, added and removed cleanly.
    "Win32_System_Registry",
    # The clipboard tools (CF_UNICODETEXT) and the moveable global memory a
    # clipboard write has to be handed on.
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    # GetUserPreferredUILanguages, for the Vietnamese interface default.
    "Win32_Globalization",
    # GetModuleHandleW, for the hook module handle.
    "Win32_System_LibraryLoader",
] }

# Stamps the application icon and version metadata into the executable. A build
# dependency, so it costs nothing at runtime — and the .ico it embeds is
# committed (scripts/make-icon.ps1 regenerates it), so building GlowKey needs no
# image tooling.
# The settings window, and only the settings window. The tray is raw Win32 and
# stays that way: it is the always-resident half, and a background input method
# must never be the reason a machine feels slow. This window is created on
# demand and destroyed on close, so nothing here runs while GlowKey sits idle.
#
# Chosen over raw Win32 dialogs deliberately — see phase-05 of the port plan.
# The panes are lists and checkboxes, which is exactly where Win32 dialog
# templates cost the most and buy the least.
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
