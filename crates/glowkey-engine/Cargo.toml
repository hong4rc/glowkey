[package]
name = "glowkey-engine"
version = "0.1.0"
description = "Vietnamese Telex and VNI transformation: raw keystrokes in, a minimal edit out. The core of GlowKey."
edition = "2021"
license = "MIT"
repository = "https://github.com/hong4rc/glowkey"
homepage = "https://github.com/hong4rc/glowkey"
documentation = "https://docs.rs/glowkey-engine"
readme = "README.md"
keywords = ["vietnamese", "telex", "vni", "ime", "input-method"]
categories = ["text-processing", "internationalization"]
rust-version = "1.96"

[dependencies]
# vi 0.8.0 is MIT (LICENSE file is verbatim MIT text; crates.io shows
# "non-standard" only because it declares license-file rather than an SPDX id).
# See THIRD-PARTY-NOTICES.md — the notice must ship with any distribution.
vi = "0.8"
phf = { version = "0.11", features = ["macros"] }
# Only so `InputMethod` and `PlacementStyle` can sit in a consumer's settings
# file. Off by default: the engine itself persists nothing.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
