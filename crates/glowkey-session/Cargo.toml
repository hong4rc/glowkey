[package]
name = "glowkey-session"
version = "0.1.0"
description = "Typing policy over the GlowKey engine: VN/EN mode, per-application exclusions, auto-fix, macros and word overrides"
edition = "2021"
license = "MIT"
repository = "https://github.com/hong4rc/glowkey"
homepage = "https://github.com/hong4rc/glowkey"
documentation = "https://docs.rs/glowkey-session"
readme = "README.md"
keywords = ["vietnamese", "telex", "vni", "ime", "input-method"]
categories = ["text-processing", "internationalization"]
rust-version = "1.96"

# The engine and nothing else. This crate is where a *product's* decisions live
# (which applications to leave alone, whether to undo a bad transformation at a
# word boundary), but it still knows no operating system: what an application
# is called, and which ones ship excluded, are handed in by the shell.
[dependencies]
glowkey-engine = { path = "../glowkey-engine", version = "0.1.0" }
# Only for persisting macros and word overrides; a consumer with its own
# storage does not pay for it. The `serde` feature also turns on the engine's,
# so `InputMethod` and `PlacementStyle` round-trip alongside.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json", "glowkey-engine/serde"]

[dev-dependencies]
# Generated keystroke sequences for the invariant suite (tests/properties.rs).
# The one load-bearing rule, "rendered == the text tail at the caret", is a
# property, not a list of examples, and the examples cannot cover the
# keystroke space. Pinned failures live in proptest-regressions/, which is
# committed so a CI failure reproduces locally.
proptest = "1"
# Keystroke latency numbers for the record (benches/keystroke.rs). An input
# method's latency is a feature: the session re-derives the whole word through
# the engine on every key, and the bench is what says what that costs.
# `harness = false` below is required, or cargo runs the bench as a test target.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "keystroke"
harness = false
